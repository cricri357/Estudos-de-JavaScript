<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somando números</title>
    <style>
        body {
            font: normal 20pt;
        }
        input {
            font-size: 30px;
        }
        div {
            padding: 10px;
            font-size: 40px;
        }
    </style>
</head>
<body>
    <h1>Somando Valores</h1>
    <input type="number" name="txtn1" id="txtn1"> 
    <input type="number" name="txtn2" id="txtn2">
    <input type="button" value="SOMAR" onclick="somar()">
    <div id="res">Resultado</div>

    <script>
        function somar() { // função somar chamada no evento onclick do botão
            var tn1 = window.document.getElementById('txtn1') // id txtn1
            var tn2 = window.document.querySelector('input#txtn2') // elemento input com id txtn2 (query selector é a melhor opção de seleção)
            var r = window.document.getElementById('res') // pega o elemento pelo id res
            var n1 = Number(tn1.value) // tranforma para número o atributo valor do input
            var n2 = Number(tn2.value)
            var s = n1 + n2
            r.innerHTML = `A soma entre ${n1} e ${n2} é igual a <strong>${s}</strong>` // mudança do innerhtml do elemento r 
        }
    </script>
</body>
</html>
