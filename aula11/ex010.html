<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETRAN</title>
</head>
<body>
    <h1>Sistema de multas</h1>
    Velocidade do carro <input type="number" id="txtvel"> Km/h
    <input type="button" value="VERIFICA" onclick="calcular()">
    <div id="res">
    </div>

    <script>
        function calcular() { // função calcular chamada no evento do botão
            var txtv = window.document.getElementById('txtvel') // pega o elemento pelo id 
            var res = window.document.querySelector('div#res') // usa o query selector elemento div com id res
            var vel = Number(txtv.value) // converte o valor do input para número
            res.innerHTML = `Sua velociade atual é <strong>${vel} Km/h</strong>` // muda o html do resultado

            if (vel > 60) { // se velociade maior que 60
                res.innerHTML = 'Voce ultrapassou o limite de velociade! <br> <strong>MULTADO<strong>' // muda o html do resultado
            }
            res.innerHTML += '<br>Dirija sempre com cuidado!'
        }
    </script>
</body>
</html>
