<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 3</title>
    <style>
        body {
            background-color: rgb(113, 113, 209);
            color: white;
        }

        p {
            font-size: 20px;
        }

        h1 {
            font-size: 40px;
        }
    </style>
</head>

<body>
    <h1>Olá, mundo!</h1>
    <p>Já me livrei da maldição!!</p>
    <script>
        var n1 = Number.parseInt(window.prompt('Digite um número: ')) // encapsulamento de string digitada no prompt para int
        var n2 = Number(window.prompt('Digite outro número: ')) // a mesma coisa escrita de uma forma diferente
        // Number.parseInt()
        // Number.parseFloat() // encapsulamento de string para float
        // Number()
        // String()
        var soma = n1 + n2
        window.alert(`a soma é igual a ${soma}`) // ${} é um placeholder para a variável soma 
        // pode ser usada concatenação
    </script>
</body>

</html>
