<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 2</title>
    <style>
        body {
            background-color: rgb(113, 113, 209);
            color: white;
        }

        p {
            font-size: 20px;
        }

        h1 {
            font-size: 40px;
        }
    </style>
</head>

<body>

    <p>Já me livrei da maldição!!</p>

        var nome = window.prompt('Qual é o seu nome?') // a variável nome recebe o resultado da janela de prompt

    </script>
</body>
